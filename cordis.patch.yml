# Mount the engine replacement. The preset takeover in `dists/gate.js` renames
# the stock rows inside agent presets, which is why this entry only has to exist
# at the profile level.
- insert:
    - id: span-compaction
      name: dsh-span-compaction
# Disable the HOST-PLANE compaction-basic row. Without this the profile-level
# engine stays `auto: true` and registers its own pressure / overflow listeners on
# the root context, compacting the same session a second time with the stock
# unbounded replay span — that summary request carries the whole history and is
# rejected as too large. Preset rows are outside a patch's reach; the gate renames
# them to this engine instead, which keeps their `auto` and applies the bounded
# span. A patch replaces the row's whole config (no deep merge), so other keys on
# this row fall back to their defaults — the same trade-off billion-context makes.
- id: compaction-basic
  config:
    auto: false
