# Mount the engine replacement. The preset takeover in `dists/gate.js` renames
# the stock rows inside agent presets, which is why this entry only has to exist
# at the profile level.
- insert:
    - id: span-compaction
      name: dsh-span-compaction
# `auto: false` stops listeners but still registers the compaction service.
# Disable the host row so Span Compaction can own that service. Preset rows
# are replaced separately by the preset gate.
- id: compaction-basic
  disabled: true
